# NTS-authenticated sources from independent operators

server time.cloudflare.com nts iburst
server nts.netnod.se nts iburst
server ptbtime3.ptb.de nts iburst
server a.st1.ntp.br nts iburst
server nts.teambelgium.net nts iburst
server time1.mbix.ca nts iburst
server ntp.miuku.net nts iburst
server paris.time.system76.com nts iburst
server ntp3.ipv6.fau.de nts iburst
server ntp.nanosrvr.cloud nts iburst
server ntppool1.time.nl nts iburst
server ntp.3eck.net nts iburst
server ohio.time.system76.com nts iburst
server ntp1.wiktel.com nts iburst
server ptbtime1.ptb.de iburst nts

# Only use authenticated (NTS) sources, even if unauthenticated ones are added later.
# Don't add nocerttimecheck: the initial clock comes from the untrusted host.
authselectmode require

# Require at least 2 agreeing sources before adjusting the clock
minsources 2

# Keeps the frequency offset across chronyd restarts (not across reboots, the rootfs is an initramfs)
driftfile /var/lib/chrony/chrony.drift

# Step the clock if it's off by more than 1 second, but only in the first 3 updates
makestep 1 3

# Don't let bad estimates upset the clock
maxupdateskew 100.0

# Sync the RTC from the system clock every 11 minutes
rtcsync

# TAI-UTC offset and leap seconds from the tz database
leapseclist /usr/share/zoneinfo/leap-seconds.list
